[package]
name = "lean4-ide-proxy"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "process", "rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
