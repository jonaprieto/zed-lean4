[package]
name = "lean4-ide-proxy"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
getrandom = "=0.3.4"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rust-embed = "=8.14.0"
anyhow = "1.0.104"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "net", "time"] }
tokio-tungstenite = "=0.29.0"
futures-util = { version = "=0.3.34", features = ["sink"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "=0.2.3"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["time"] }
