id = "lean4-ide"
name = "Lean 4 IDE"
version = "0.5.2"
schema_version = 1
description = "Lean 4 support with goal state and terminal and browser infoviews."
repository = "https://github.com/jonaprieto/zed-lean4-ide"
authors = ["owlx56 <owlx365@gmail.com>", "Jonathan Prieto-Cubides <prieto.jona@gmail.com>"]
snippets = "snippets/lean 4.json"

[language_servers.lean4-ide]
name = "Lean4 Language Server"
languages = ["Lean 4"]

[grammars.lean]
repository = "https://github.com/jonaprieto/tree-sitter-lean"
rev = "3796b4f11c6460b77767a0f3945878b85546e472"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["leanprover", "elan", "**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["jonaprieto", "zed-lean4-ide", "**"]
