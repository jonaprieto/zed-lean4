id = "lean4-ide"
name = "Lean 4 IDE"
version = "0.4.0"
schema_version = 1
description = "Lean 4 support with goal state and terminal and browser infoviews."
repository = "https://github.com/jonaprieto/zed-lean4"
authors = ["owlx56 <owlx365@gmail.com>", "Jonathan Prieto-Cubides <prieto.jona@gmail.com>"]
snippets = "snippets/lean 4.json"

[language_servers.lean4-ide]
name = "Lean4 Language Server"
languages = ["Lean 4"]

[grammars.lean]
repository = "https://github.com/Julian/tree-sitter-lean"
rev = "916c44f4d89c970f66dd34a49e7ce848f4d29e72"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["leanprover", "elan", "**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["jonaprieto", "zed-lean4", "**"]
